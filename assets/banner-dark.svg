<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">undemo — Small steps. Relentless progress.</title>
  <desc id="desc">A charcoal and amber pixel poster. A small square climbs five steps, one step at a time.</desc>
  <style>
    .runner { animation: climb 10s step-end infinite; }
    @keyframes climb {
      0%, 14%, 100% { transform: translate(0px, 0px); }
      15%, 29% { transform: translate(72px, -40px); }
      30%, 44% { transform: translate(144px, -80px); }
      45%, 59% { transform: translate(216px, -120px); }
      60%, 99% { transform: translate(288px, -160px); }
    }
    @media (prefers-reduced-motion: reduce) { .runner { animation: none; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0c0d0f"/>
    <path d="M708 34v292" stroke="#f3ede2" stroke-opacity=".12"/>
    <text x="53" y="170" fill="#f3ede2" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="-9">undemo</text>
    <text x="61" y="237" fill="#f3ede2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="500" letter-spacing="-1">Small steps.</text>
    <text x="61" y="285" fill="#ffb454" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="34" font-weight="500" letter-spacing="-1">Relentless progress.</text>
    <rect x="61" y="44" width="24" height="7" fill="#ffb454"/>
    <rect x="89" y="44" width="7" height="7" fill="#ffb454" opacity=".4"/>
    <path d="M760 322h344" stroke="#f3ede2" stroke-opacity=".15" stroke-dasharray="2 8"/>
    <g opacity="0.28"><path d="M760 278h56v12h-8v12h-48z" fill="#ffb454"/><path d="M760 302h48" stroke="#ffb454" stroke-width="2"/></g>
    <g opacity="0.46"><path d="M832 238h56v12h-8v12h-48z" fill="#ffb454"/><path d="M832 262h48" stroke="#ffb454" stroke-width="2"/></g>
    <g opacity="0.64"><path d="M904 198h56v12h-8v12h-48z" fill="#ffb454"/><path d="M904 222h48" stroke="#ffb454" stroke-width="2"/></g>
    <g opacity="0.8200000000000001"><path d="M976 158h56v12h-8v12h-48z" fill="#ffb454"/><path d="M976 182h48" stroke="#ffb454" stroke-width="2"/></g>
    <g opacity="1"><path d="M1048 118h56v12h-8v12h-48z" fill="#ffb454"/><path d="M1048 142h48" stroke="#ffb454" stroke-width="2"/></g>
    <g class="runner" fill="#f3ede2">
      <rect x="778" y="256" width="16" height="16"/>
      <rect x="778" y="256" width="5" height="5" fill="#ffb454"/>
    </g>
    <path d="M1060 59h48v48h-12V83l-35 35-9-9 35-35h-27z" fill="#ffb454"/>
    <text x="760" y="52" fill="#f3ede2" fill-opacity=".48" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">ONE DAY. ONE STEP.</text>
    <text x="1094" y="326" text-anchor="end" fill="#ffb454" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">+1</text>
  </g>
</svg>
