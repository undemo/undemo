name: Update profile visuals

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub cards
        run: |
          curl --fail --silent --show-error --retry 3 \
            'https://stats.justsong.cn/api/github?username=undemo&theme=light&lang=zh-CN' \
            --output profile/stats.svg
          curl --fail --silent --show-error --retry 3 \
            'https://stats.justsong.cn/api/github?username=undemo&theme=tokyonight&lang=zh-CN' \
            --output profile/stats-dark.svg

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=undemo&layout=compact&langs_count=6&hide_border=true&theme=light_github&card_width=382
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=undemo&layout=compact&langs_count=6&hide_border=true&theme=tokyonight&card_width=382
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: undemo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile visuals"
          git push
